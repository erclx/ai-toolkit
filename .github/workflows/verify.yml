name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-checks:
    name: 🛡️ Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so origin/main resolves for the merge-base reads.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Shell Tools
        run: sudo apt-get install -y shfmt shellcheck

      - name: Install Plugin CLI
        # Pinned deliberately. Reason and revisit test in .claude/context/ci.md
        run: bun install -g @anthropic-ai/claude-code@2.1.236

      - name: Verify
        run: bun run check:ci

      - name: Verify install
        run: bun run check:install
