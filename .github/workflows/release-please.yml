name: Release
# canon-no-seed: publishes this package to the registry as @erclx/canon and writes this checkout's own plugin.json version through extra-files. Seeding it as-is would have a target publish itself under this package's name.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        # Empty runs release-please as usual, a tag publishes that tag alone
        description: Tag to publish
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: 🏷️ Release Please
    runs-on: ubuntu-latest
    # A dispatch naming a tag republishes it, so no release is cut
    if: github.event_name == 'push' || inputs.tag == ''
    # Scoped to this job alone, since publish must run to completion once started
    concurrency:
      group: release-please
      cancel-in-progress: true
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Runs before the tag exists, so a release is never cut it cannot publish
      - name: Verify the publish credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add the secret before a release can be cut."
            exit 1
          fi
          if ! curl -sf -H "Authorization: Bearer $NPM_TOKEN" https://registry.npmjs.org/-/whoami >/dev/null; then
            echo "::error::NPM_TOKEN did not authenticate. It is likely expired or revoked."
            exit 1
          fi

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Not GITHUB_TOKEN, which authors a bot pull request CI will not run
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: 📦 Publish
    needs: release-please
    # release-please is skipped on a tag dispatch, so the gate cannot need its success
    if: >-
      !cancelled()
      && (needs.release-please.outputs.release_created == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm 10 runs prepare under --ignore-scripts, npm 11 honors the flag
      - name: Pin npm
        run: npm install -g npm@11

      - name: Publish
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
