name: Phase Label Gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main
  workflow_dispatch:

jobs:
  phase-label-gate:
    name: 🏷️ Phase Label Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Scan the pull request for a phase label or a board identifier
        run: bun src/cli.ts labels scan --event "$GITHUB_EVENT_PATH"
