<!-- A bound ledger: two pages fanned open around a spine, drawn as three
     solid masses rather than thin strokes, so the shape survives being
     rendered at favicon size instead of averaging into grey. The 10-unit
     gap between each page and the spine, against an 80-unit frame, is what
     keeps the split a visible channel at 16px; a first draft at half that
     gap closed into an unreadable blob at the same size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 80 80">
  <path d="M34,20 L15,28 L15,72 L34,80 Z M66,20 L85,28 L85,72 L66,80 Z" fill="currentColor" />
  <rect x="44" y="15" width="12" height="70" rx="2" fill="currentColor" />
</svg>
