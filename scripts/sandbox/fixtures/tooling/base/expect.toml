# What `tooling inject base` leaves behind once the phase-label-gate workflow
# ships through the `base` config rather than staying checkout-root only. Read
# by `canon sandbox check`. Patterns use TOML literal strings so a regex needs
# no backslash escaping.
#
# No `max_turns`. The arm runs `bun src/cli.ts tooling inject base` with no
# agent driving it, so no envelope is produced and a ceiling here would sit
# permanently skipped.

# The seeded workflow landed at the same relative path a target's own
# `.github/workflows/` resolves, alongside the `verify.yml` every base inject
# already carried.
paths = [".github/workflows/phase-label-gate.yml", ".github/workflows/verify.yml"]

manual = [
  "The seeded copy's job shape matches the checkout-root original. Semantic: a content pin can confirm the scan step invokes the published CLI, but cannot confirm the triggers, the `if:`, and the job name were copied rather than reinvented",
  "The checkout-only `src/cli.ts` path never leaked into the seeded copy. Semantic: `test()` runs per line under the `m` flag, so a negative pattern matches on any line that lacks the substring rather than asserting no line carries it, which the single scan-step pin below already covers by naming the one invocation the step takes",
]

# The scan step names the published CLI rather than this checkout's own source
# tree, which is the whole point of seeding a portable copy. A run that copied
# the checkout-root file verbatim, `bun src/cli.ts labels scan` included, fails
# here, since a target has no `src/cli.ts` to resolve.
[[content]]
path = ".github/workflows/phase-label-gate.yml"
pattern = 'bunx -y @erclx/canon labels scan'
