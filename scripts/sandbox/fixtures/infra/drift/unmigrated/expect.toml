# What `aitk sync --check --json` reports on a target whose snippets sit at the
# root with nothing under `.claude/`. Read by `aitk sandbox check`. Patterns use
# TOML literal strings so a regex needs no backslash escaping.
#
# This is the arm that would have failed before the change rather than erroring.
# The domain scan lists only domains it finds installed, so a fully unmigrated
# project reported zero entries and read as clean.
#
# Snippets rather than standards, because standards installs into no target and
# a root `standards/` folder there is the project's own authoring surface.

paths = ["drift-report.json"]

absent = [".claude/snippets"]

# The report does not also claim the domain is merely unstamped. Those are
# different causes needing different commands, and conflating them is what sent
# a reader to `aitk snippets sync` for a target that has nothing to sync.
#
# Declared above the content blocks deliberately. A bare key below a `[[content]]`
# header binds to that table rather than to the document, which is how an arm
# ships manual entries that never reach the unchecked count.
manual = [
  "The closing stderr line does not list `snippets` as unstamped, since the unmigrated section already names it. Semantic: the assertion is about which of two sections a domain appears in, and the JSON report carries neither stderr line",
  "No `standards` entry appears anywhere in the report, since the domain left the scan with the install channel. Semantic: an absence across a whole document is not a pattern a content block can pin",
]

# The domain is named as unmigrated, with both the layout it sits in and the one
# it belongs at. Naming only the domain would not distinguish this from a domain
# that was never installed.
[[content]]
path = "drift-report.json"
pattern = '"domain": "snippets"'

[[content]]
path = "drift-report.json"
pattern = '"rootPath": "snippets"'

[[content]]
path = "drift-report.json"
pattern = '"installPath": "\.claude/snippets"'

# A file count above zero. An unmigrated entry with no files would mean the
# detection fired on an empty directory, which is the false positive the
# markdown count exists to prevent.
[[content]]
path = "drift-report.json"
pattern = '"files": [1-9]'
