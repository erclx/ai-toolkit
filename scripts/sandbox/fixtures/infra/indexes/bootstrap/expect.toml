# What a correct `/setup-indexes` run leaves behind against a bare folder of
# five raw markdown files with no frontmatter and no index.md. Read by
# `canon sandbox check`, which only asserts against what a run left behind
# and drives nothing itself. `scripts/sandbox/run.sh infra:indexes
# "/canon:setup-indexes" bootstrap` drives this arm headlessly the same way
# it drives any `claude:setup-smoke` arm, category is not what gates it.
#
# Driven twice on 2026-09-07: the scan finds `docs/` as the sole candidate
# and the skill reaches `## Present candidates`, which lists it and asks
# which folder to bootstrap, a question no reply channel reaches on a single
# headless turn. Both runs left `docs/` untouched, at 9 and 4 turns
# ($0.137 and $0.120), and each phrased the follow-up differently ("Would
# you like me to bootstrap `docs/`? (yes / no — or name it explicitly if you
# want a different scope)" against "Which folder would you like to
# bootstrap? You can say `docs`, `all`, or `none`."), matching the sibling
# `no-candidate` arm's finding that no reply substring survives both.

max_turns = 16

absent = ["docs/index.md"]

manual = [
  "The reply names docs/ as the sole candidate, its file count, and its frontmatter coverage, then asks which folder to bootstrap. Semantic: the exact phrasing varies run to run, so a substring pin would be fragile and the correctness of the paraphrase is a judgment no pattern can carry",
]

# Proves docs/architecture.md was not touched: the raw seeded body carries no
# frontmatter, and the run stopped before any draft, scaffold, or inject step
# could add it.
[[content]]
path = "docs/architecture.md"
pattern = '^# Architecture\n\nSystem boundaries and module responsibilities for the sample project\. Defines how the API gateway forwards requests to the worker pool and where state persists\.\n$'
