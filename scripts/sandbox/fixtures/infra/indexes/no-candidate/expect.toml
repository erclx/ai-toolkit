# What a correct `/canon:setup-indexes` run leaves behind against a bare
# CLAUDE.md with no markdown-heavy folder anywhere. Read by `canon sandbox
# check`, which only asserts against what a run left behind and drives
# nothing itself. The scan finds no candidate, so the skill skips straight
# to the convention seed offer against the CLAUDE.md `seed_no_candidate`
# stages. No reviewing session has run it yet.

max_turns = 30

absent = ["docs/index.md"]

manual = [
  "The convention seed offer resolves to accept rather than decline. Semantic: acceptance is the operator's call and no pattern can force it, so the content pins below only hold when the run's own judgment lands there",
]

reply = ["Bootstrap complete."]

[[content]]
path = "CLAUDE.md"
pattern = '^## Indexes$'

[[content]]
path = "CLAUDE.md"
pattern = '^- When a folder has an `index\.md`, check it before reading individual files in that folder\.$'
