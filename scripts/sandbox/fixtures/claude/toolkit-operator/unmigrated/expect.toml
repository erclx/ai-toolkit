# What a correct `/aitk:toolkit-operator` run replies on a target whose snippets
# sit at the root. Read by `aitk sandbox check`. Patterns use TOML literal
# strings so a regex needs no backslash escaping.
#
# Snippets alone, since standards left the root layouts with the install channel.
# A root `standards/` folder in a target is the project's own authoring surface
# now, so nothing proposes moving it.
#
# This is the route `v42.0` shipped and nothing executed. The report half was
# verified against three sandbox arms and six real targets while the routing half
# had never been run, which is the gap this arm closes.

# A clean run cost 6 turns on 2026-08-04, the cheapest of the three. The route
# resolves off one report read with nothing to execute behind it, so the run ends
# where the other two carry on into the skill they named.
max_turns = 12

# The route. `unmigrated` is the finding the skill's own diagnose step calls the
# most urgent, because a domain sitting at the root reports no drift of its own
# while being entirely behind, so a run that read the report and routed on the
# quiet domains instead lands here.
reply = ["migration-standards"]

# Nothing moved. The operator is a router and `migration-standards` proposes
# rather than executes, so both halves of the handoff leave the tree as staged.
# These fail the run that decided correctly and then ran the moves itself, which
# is the one wrong outcome a reply pin cannot see.
paths = ["snippets/align.md"]

absent = [".claude/snippets"]

# Prose the checker cannot assert, each with the reason it stays here.
manual = [
  "The reply does not route to `aitk snippets sync`. Semantic: a negative substring passes on every reply that phrases the wrong route differently, and that route is the specific mistake a root layout invites, since the domain scan lists only domains it finds installed",
  "The superseded section was reported and nothing acted on it. Unwired: this fixture stages no superseded artifact, so the claim needs an arm that does",
]
