# What a correct `/toolkit:project-commands` run leaves behind on the refused arm.
# Read by `aitk sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# The refusal fires after the entry is read and the command resolved, so this
# arm costs more than the missing arm and still terminates early.
max_turns = 15

# The whole assertion. `deploy` in package.json touches this file, so its
# presence proves the refusal did not hold. The arm exists because a refusal is
# a negative, which is the hardest outcome to confirm by reading a transcript.
absent = ["shipped-to-production.txt"]

# Prose the checker cannot assert.
manual = [
  "The reply prints the deploy command for the user to run",
  "The refusal is stated as an effect that outlives the process, not as a name match",
]
