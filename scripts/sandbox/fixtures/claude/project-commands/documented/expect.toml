# What a correct `/aitk:project-commands` run leaves behind on the documented arm.
# Read by `aitk sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# A clean run cost 7 turns on 2026-07-31. Set above that rather than at it. This
# arm starts two services and reads each one's port back from a backgrounded
# call, so it is the most expensive of the three and the one whose cost is most
# likely to move.
max_turns = 14

# The arm's central assertion. Each service writes its sentinel at startup, so
# both paths present is the only mechanical proof that the request resolved to
# every command it covered. Running one of the two is the failure this arm
# exists for, and it reads as a pass in a transcript.
paths = ["web-started.txt", "api-started.txt"]

# Prose the checker cannot assert. The stop condition is the part that genuinely
# resists assertion, since nothing distinguishes an agent that stopped from one
# that ran out of things to do.
manual = [
  "The reply reports both ports and ends there",
  "No log read past a failure, no browser, no second check after the first passed",
  "No defect noticed during startup is reported",
]
