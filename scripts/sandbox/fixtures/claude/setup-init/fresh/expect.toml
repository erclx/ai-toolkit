# What a correct `/aitk:setup-init` run leaves behind on the `fresh` arm. Read by
# `aitk sandbox check`. Patterns use TOML literal strings so a regex needs no
# backslash escaping.
#
# This arm runs the real installer against a tree carrying no framework
# evidence. Every path below was read off the tree a run produced on 2026-08-03
# rather than projected from what `buildSteps` orders.

# A clean run cost 20 turns on 2026-08-03 against the default cap of 30. The
# ceiling sits at the cap rather than at the observation: a truncated run reports
# one turn past its cap, so an equal ceiling still catches truncation while never
# failing a legitimate run that lands in the gap a lower number would open.
max_turns = 30

# One path per domain the chain installs. `buildSteps` orders six of them and a
# run that reported success while skipping one leaves the other five in place, so
# a single path proves nothing about the chain.
#
# `.claude/GOV.md` is not among them. The `fresh` arm's own stage prose claimed
# `aitk init` builds it until 2026-08-03, and `src/gov/adapter.ts` names it
# `RETIRED_GOV_FILE`. The first run of this arm failed on it, which is the stale
# expectation the declaration exists to catch.
paths = [
  "CLAUDE.md",
  ".claude/rules/core/000-constitution.md",
  ".claude/standards/prose.md",
  ".claude/snippets/meta-prompt.md",
  ".claude/wiki/index.md",
  "commitlint.config.js",
]

# The two fallbacks, asserted rather than described. `base` carries no framework
# rule and no framework config, so a run that read an empty project and picked
# `react` anyway lands the first, and one that ran step 2 instead of skipping it
# lands the other two. These are claims about what the resolve step decided, not
# assertions inverted over output the snapshot cannot reach.
absent = [
  ".claude/rules/framework/200-react.md",
  "vite.config.ts",
  "eslint.config.js",
]

# No `write_scope`. `aitk init` writes a whole project scaffold and `setup-verify`
# runs `bun install` behind it, so the narrowest glob admitting a correct run is
# `**`. A first pass declared exactly that and asserted 7772 node_modules paths,
# none of which can fail. A scope that cannot go red is the silent-green shape
# the checker exists to prevent, so this arm makes no scope claim at all.

reply = ["base"]

manual = [
  "`setup-verify` runs and reports the base scripts alone. Unwired: the claim is about which commands were invoked, which the envelope does not carry",
  "The preview names each detected technology beside the file it was detected in. Semantic: this arm carries no framework evidence, so a correct preview reports an empty detection and no substring separates that from a preview that skipped the step",
  "The run reaches nothing outside the sandbox tree. Semantic: the install legitimately writes the whole tree, so no `write_scope` glob distinguishes a correct run from a wrong one and the claim has no mechanical form here",
]

# All three domains stamped their manifest. A run that installed governance and
# stopped leaves a well-formed `aitk.json` carrying one entry, which every path
# above still passes.
[[content]]
path = ".claude/aitk.json"
pattern = '"covers": \["standards", "snippets", "governance"\]'
