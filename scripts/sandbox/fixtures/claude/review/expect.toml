# What a correct `/canon:claude-review` run leaves behind on the default arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.
#
# The report is shared session scratch and used to escape the sandbox, which
# demoted every claim over it. The sandbox now provisions outside the toolkit
# worktree, so the report lands inside the tree and the assertions over it run.

# The one mechanical claim that is about provisioning rather than about the run.
# No corpus installs into a target, so the project copy of the standard is absent
# and `${CLAUDE_SKILL_DIR}/../../standards/skill.md` is the only route left. The
# absence is asserted rather than assumed, since an arm that staged a copy of its
# own would resolve the project path instead and void the whole premise here.
absent = [".claude/standards/skill.md", "standards/skill.md"]

# The filename is the evidence, not the file. `review-user-batch.md` is the
# slug transform in `standards/skill.md` applied to branch `feat/user-batch`, and
# that transform appears in no skill body, so a report at this exact path is what
# proves the plugin fallback resolved.
paths = [".claude/review/branch/review-user-batch.md"]

# Bounds where the run may write. Live rather than declared intent now: the
# report lands inside the tree, so the write list carries it and each entry is
# checked against these globs.
write_scope = [".claude/**"]

# No max_turns. Runs on 2026-08-02 came in at 9 and 15 turns against the default
# cap of 30, and a ceiling set from the low end of that spread would fail
# legitimate runs rather than catch truncation.

manual = [
  "The off-by-one on `i <= ids.length` is ranked critical rather than minor. Semantic: severity is the skill's judgment and a substring cannot tell a correct ranking from a word that happens to appear",
  "The report names the fetch with no error handling and the mutating `mergeUser`. Semantic: both are describable in wording no pattern anticipates, and pinning one phrasing goes red on a rewrite that is just as correct. Runs on 2026-08-02 disagreed on the fetch, which is the variance the demotion covers",
]

# Every key above this line is top level. A bare key written below a
# `[[content]]` header belongs to that table in TOML, so anything moved down here
# would parse clean and assert nothing. `contentArray` rejects that now.

# The summary line and the file under review, which are the two things every
# correct run states in the same shape. The counts stay as digits because
# severity is the skill's judgment, asserted here only for appearing in the
# format the skill's own body fixes.
[[content]]
path = ".claude/review/branch/review-user-batch.md"
pattern = '[0-9]+ critical, [0-9]+ should-fix, [0-9]+ minor'

[[content]]
path = ".claude/review/branch/review-user-batch.md"
pattern = 'src/api/users.ts'
