# What a correct `/canon:migration-superseded` run leaves behind on a target
# holding three retired `.claude/` files. Read by `canon sandbox check`. Patterns
# use TOML literal strings so a regex needs no backslash escaping.
#
# The skill proposes and writes nothing, so the tree assertions carry the whole
# no-write claim and the reply pins carry whether the proposal was sourced
# correctly. Splitting it that way is what keeps a run that reasoned well and
# then applied the split from passing.

# The default cap rather than an observation. A pass on 2026-08-13 cost 17 turns,
# and a ceiling at the cap still catches a truncated run, which reports one turn
# past it.
#
# `canon-operator/unmigrated` derives a ceiling from one 6-turn observation and
# this arm does not, because a route arm stops at the skill it names and its work
# is fixed by that route. A proposal-only arm reads the whole staged tree and
# resolves three retired files against three standards, so its turn count varies
# with how a run orders those reads and 17 is one path through them. A second
# observation is what separates a stable cost from one sample of a variable one.
max_turns = 30

# The proposal, pinned on the standard each entry resolved to rather than on the
# destination folder. Naming `.claude/tasks/` proves only that the run echoed
# `replacedBy` off the report, which it gets for free. Naming the standard is
# what separates a shape the run read from one it invented, and the two entries
# are pinned separately because a run reaching only the first passes one and
# fails the other.
#
# The verb rather than a path, since no corpus installs into a target and
# `canon standards <name>` is the only route the skill has to either shape.
#
# `git rm --cached` is the third. One of the three retired files is tracked while
# ignored, and the untrack is the half of that pair a user gets wrong.
reply = [
  "canon standards tasks",
  "canon standards diagrams",
  "git rm --cached",
]

# Every retired file is still where the fixture put it. The content is
# project-authored and the skill proposes rather than migrates, so a run that
# produced a correct proposal and then applied it fails here and nowhere else.
paths = [".claude/TASKS.md", ".claude/DIAGRAMS.md", ".claude/HOOKS.md"]

# No destination folder was created. `.claude/hooks` carries the extra weight:
# no standard declares `appliesTo` over it, so a run that proposed a shape for it
# rather than declining had to invent one, and inventing one is the failure this
# entry catches whether or not the reply admitted to it.
absent = [".claude/tasks", ".claude/diagrams", ".claude/hooks"]

# Prose the checker cannot assert, each with the reason it stays here.
manual = [
  "The untrack is named ahead of the ignore entry rather than after it. Semantic: a substring proves the command appears and carries no ordering, and the reversed order is the whole defect the pair exists to prevent",
  "The third entry was declined rather than proposed for. Semantic: a decline and a proposal both name `.claude/hooks`, so the tokens do not separate them, and only the absence assertion above sees the folder a wrong run would create",
  "No phase label was invented for the task filenames. Semantic: the destination convention requires one and the retired file records none, so a run supplying `v01.0` produces a filename indistinguishable in shape from a correct proposal that left the label to the user",
  "The DIAGRAMS.md split lands on the two fixed filenames the standard names rather than on names taken from the headings. Semantic: both spellings are plausible substrings and neither is stable enough to pin without going red on a rewording",
  "The unresolved refusal was never exercised. Unwired: every standard resolves through the package corpus, so the branch needs an arm where that read fails",
]

# The retired task file is byte-identical, pinned from its first line to its
# last. A run that helpfully emptied it after proposing the split, or that struck
# the entries it had migrated, leaves the path assertion above passing and fails
# here.
[[content]]
path = ".claude/TASKS.md"
pattern = '^# Tasks\n\n## Retry a timed-out renewal\n\nThe invoice job drops a renewal when the payment provider times out\.\n\n- \[ \] A timed-out renewal retries once before the job records it as failed\n- \[ \] The retry count is visible in the job log\n\n## Split the billing webhook handler\n\nOne handler switches on six event types and no test covers the last three\.\n\n- \[x\] Each event type routes to its own handler\n- \[ \] The three uncovered types have tests$'

# The diagram file keeps both kinds. The split proposal names two destination
# files and a run that moved either fence out of here fails this.
[[content]]
path = ".claude/DIAGRAMS.md"
pattern = '^## System context$'

[[content]]
path = ".claude/DIAGRAMS.md"
pattern = '^## Deployment$'

# The ignore entry survives. The skill names the line and leaves it, since
# removing it before the untrack is the ordering defect, and removing it after
# is still the user.s edit to make.
[[content]]
path = ".gitignore"
pattern = '^\.claude/TASKS\.md$'
