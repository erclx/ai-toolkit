# What a correct `/claude-teach` run leaves behind on the lesson arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# The seeded workspace matches the resume arm's with one difference: `assets/` is
# empty. This arm is about the rendered layer rather than the placement, so the
# assertions sit on the lesson file, the stylesheet it links, and the ordinal it
# lands on, and the placement behavior stays where the resume arm already covers
# it.

# Every top-level key sits above the first `[[content]]` block. A bare key below
# one belongs to that table in TOML, so a `manual` array written at the bottom
# parses clean and asserts nothing.

# Measured at 23 turns and 1.06 dollars on 2026-08-19, passing every mechanical
# assertion. The ceiling stays at the runner default: writing a lesson follows
# whatever the subject turns out to need, which is the variable cost that stays
# at the default rather than being corrected from one sample.
#
# Never raise it above the cap the run is given. A truncated run reports one turn
# past the cap, a declaration above the cap is at least that number, and the
# checker fails an arm only on a count strictly over its ceiling, so the turn
# assertion goes green on exactly the truncation it exists to catch. A
# declaration at or under the cap sits below that number and fires.
#
# The run needs an `canon` on PATH carrying the `teach` verbs. A first attempt
# reached the machine's global install at 0.98.0, which has none of them, and the
# session refused and wrote nothing, failing every assertion for a reason the arm
# is not about.
max_turns = 30

# Both entries carry a glob because the run derives the slug behind each ordinal.
# The ordinals are what this arm asserts: the seeded lesson sits at `0001`, so a
# correct derivation lands on `0002`, and pinning a spelling of the slug would
# pass vacuously against every other spelling.
#
# The stylesheet is pinned exactly. Its name is fixed by the CLI rather than
# chosen by the run, which is what lets the second lesson in a workspace reach
# the file the first one wrote.
paths = [
  ".claude/teach/01-regex/lessons/0002-*.html",
  ".claude/teach/01-regex/assets/course.css",
]

# Three wrong turns. The first catches a lesson written as markdown, which
# carries no quiz at all. The second catches a run that overwrote the seeded
# lesson rather than numbering past it, since a lesson at `0003` means the
# ordinal came from somewhere other than the files on disk. The third catches a
# stylesheet written per lesson rather than shared, which is the pile of
# one-offs the shared file exists against.
absent = [
  ".claude/teach/01-regex/lessons/*.md",
  ".claude/teach/01-regex/lessons/0003-*.html",
  ".claude/teach/01-regex/lessons/*.css",
]

write_scope = [".claude/teach/01-regex/**"]

# The reply names the workspace, the ordinal the lesson landed on, and the
# progress against the mission. `0002` is the load-bearing token, since a run
# that wrote a lesson and overwrote `0001` reports the same workspace.
reply = [".claude/teach/01-regex/", "0002"]

manual = [
  "The lesson restates no styles of its own beside the link. Semantic: an assertion can say the link is there and cannot say a style block is not, since a regex asserting absence over a whole file has no anchor to sit at. A run that links the shared file and also restates its styles inline passes every assertion above.",
  "The stylesheet carries the values the lesson needs rather than a host project's tokens. Unwired: the seeded project carries no design record at all, so there is nothing here for a lesson to inherit and the inheriting path cannot be reached by this arm.",
  "The quiz option order came from `canon teach lesson` rather than from the run's own judgment. Unwired: the claim is about which commands were invoked, which the envelope does not carry, and the order the verb draws is uniform, so no single run's output separates a taken order from a chosen one. Position bias is a property over many runs and this arm sees one.",
  "Every option in a question is the same length. Semantic: length is a property of the prose in each option, and a pattern over the markup counts no characters.",
  "Each wrong option names a misconception someone holds rather than an obviously wrong answer. Semantic: both are options in the same markup, and the difference is whether the distractor is believable.",
  "Feedback arrives after the attempt rather than beside the question. Unwired: the ordering is a property of the page's own behavior when a learner clicks, and the checker reads the file rather than running it.",
  "The lesson opens on the two recorded wrong answers before anything new. Semantic: the resume arm carries this as manual for the same reason, and it is the placement behavior rather than the rendered layer this arm is about.",
]

# The link to the shared stylesheet, which is the whole rule for this layer. A
# lesson that restated its styles carries no such element, and one that composed
# its own filename carries a different href.
[[content]]
path = ".claude/teach/01-regex/lessons/0002-*.html"
pattern = 'href="\.\./assets/course\.css"'

# The lesson is markup that stands on its own rather than a fragment. A page
# with no document type is one a browser renders in quirks mode, which is the
# self-contained half failing quietly.
#
# The case folding is spelled as character classes because the checker compiles
# every pattern with `m` alone. An inline `(?i)` is not a flag in this engine and
# fails the assertion it belongs to as a pattern that does not compile.
[[content]]
path = ".claude/teach/01-regex/lessons/0002-*.html"
pattern = '<![Dd][Oo][Cc][Tt][Yy][Pp][Ee] [Hh][Tt][Mm][Ll]'

# The quiz and its feedback, which is the half a reference page may not carry.
# A lesson with no interactive element is a reference page filed in `lessons/`.
[[content]]
path = ".claude/teach/01-regex/lessons/0002-*.html"
pattern = 'Quiz|quiz|Question|question'

# The stylesheet holds rules rather than being an empty file the link resolves
# to. A run that created the path and wrote nothing satisfies the path assertion
# above and leaves every lesson unstyled.
[[content]]
path = ".claude/teach/01-regex/assets/course.css"
pattern = '\{[^}]*:'

# The seeded lesson survives at its own ordinal. A run reusing `0001` leaves this
# file holding the new subject instead.
[[content]]
path = ".claude/teach/01-regex/lessons/0001-reading-patterns.html"
pattern = 'Reading a pattern aloud'

# The mission is read rather than rewritten. A run that revised the success lines
# to match what it taught has moved the exit criteria rather than met them.
[[content]]
path = ".claude/teach/01-regex/MISSION.md"
pattern = '^- Rewrite a vulnerable pattern so it cannot backtrack$'
