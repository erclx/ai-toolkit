# What a correct `/claude-teach` run leaves behind on the resume arm.
# Read by `aitk sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# The seeded workspace already holds a mission, a glossary, one reference page,
# one lesson, and one learning record naming two wrong answers. This arm is
# about what the run does with that record, since placing the learner from it is
# the behavior a session with no folder cannot exercise.

# Every top-level key sits above the first `[[content]]` block. A bare key below
# one belongs to that table in TOML, so a `manual` array written at the bottom
# parses clean and asserts nothing.

# Measured at 32 turns and 1.11 dollars on 2026-08-19, passing every content and
# scope assertion and failing this key alone at its first declared value of 30.
#
# The ceiling sits above the runner's own default cap rather than at the observed
# count. `scripts/sandbox/run.sh` passes `--max-turns 30`, so a run that reaches
# the cap reports 31 or 32 whatever it was doing, and a ceiling at or below 30
# fails on truncation rather than on behavior. 45 is where that leaves it, which
# matches the intake arms for the same reason. Bring it down to the observed
# count only if the runner default rises above it.
max_turns = 45

# Nothing is pinned under `paths`. The new lesson and the new learning record
# both carry a model-derived slug behind their ordinal, so an exact path would
# name a file that may not exist however correct the run was. The numbering is
# asserted through the reply and the write scope instead.

# Three wrong turns. The first two catch a second workspace opened on a subject
# the seeded one already covers, which is what the skill's guard refuses, and
# the third catches a run that answered by planning instead of teaching.
absent = [
  ".claude/teach/02-regex",
  ".claude/teach/01-regular-expressions",
  ".claude/plans",
]

write_scope = [".claude/teach/01-regex/**"]

# The reply names the workspace it resumed and the ordinal it landed on. `0002`
# is the load-bearing token, since a run that resumed correctly and then
# overwrote `0001` reports the same workspace and a different number.
reply = [".claude/teach/01-regex/", "0002"]

manual = [
  "The next lesson opens on the two recorded wrong answers before anything new. Semantic: retrieval and review are both prose at the top of a generated page, and the difference is whether the learner is asked or told.",
  "The lazy quantifier and the capture group are both revisited, rather than one standing in for the record. Semantic: the record names two misconceptions and a pattern over the lesson cannot count how many were addressed.",
  "The resume was detected from the folder rather than asked about. Semantic: a run that asked and was answered leaves the same files as one that read the record.",
  "The reply reports progress against the mission's four success lines. Semantic: the count sits in prose, and a pattern over it either pins one phrasing or matches any digit in the message.",
  "The new learning record names the wrong answer itself rather than a count of errors. Unwired: the record is written at the end of a session the harness does not drive to completion, so a run cut short leaves it absent and the assertion cannot separate that from a run that wrote a tally.",
]

# The seeded mission is not rewritten. A resume reads it and reports against it,
# and a run that revised the success lines to match what it taught has moved the
# target rather than met it.
[[content]]
path = ".claude/teach/01-regex/MISSION.md"
pattern = '^- Rewrite a vulnerable pattern so it cannot backtrack$'

[[content]]
path = ".claude/teach/01-regex/MISSION.md"
pattern = '^date: 2026-08-10$'

# The first record survives untouched. Its two wrong answers are what the next
# session places the learner from, so a run that edited it in place destroyed
# the evidence it was reading.
[[content]]
path = ".claude/teach/01-regex/learning-records/0001-reading-patterns.md"
pattern = 'lazy quantifier was read as a separate token'

# The seeded lesson is not overwritten. A second lesson lands at `0002`, and a
# run reusing `0001` leaves this file holding the new subject instead.
[[content]]
path = ".claude/teach/01-regex/lessons/0001-reading-patterns.html"
pattern = 'Reading a pattern aloud'
