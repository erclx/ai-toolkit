# What a correct `/teach-workspace promote` run leaves behind.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# The step proposes and waits, so the arm carries the confirmation in the
# invocation the way the open arm carries the starting point. Without it the run
# stops for an answer nobody supplies and writes nothing, which is correct
# behavior and asserts none of the routing.

# Every top-level key sits above the first `[[content]]` block. A bare key below
# one belongs to that table in TOML, so a `manual` array written at the bottom
# parses clean and asserts nothing.

# Measured at 21 turns and 0.70 dollars on 2026-08-19, passing every mechanical
# assertion. The ceiling stays at the default on one sample, because this is a
# proposal-only arm resolving several files against several standards and its
# count moves with how a run orders those reads.
max_turns = 30

# The handoff name comes off the branch slug, which the arm pins to
# `promote-regex` for exactly this assertion. The source page and the workspace
# it came from both survive the pass, since promotion copies rather than moves.
paths = [
  ".canon/tmp/teach-promotion/promote-regex.md",
  ".canon/teach/01-regex/reference/reading-patterns.md",
]

# The two ways this step fails silently, both of them a run that wrote the
# destination itself rather than handing it off, in either wiki folder. The
# lesson rule has no entry here on purpose: a promoted lesson arrives as a
# second block inside the handoff file rather than as a file of its own, so an
# extension glob would pass on the run it names.
absent = [
  ".claude/wiki/tools/*.md",
  ".claude/wiki/concepts/*.md",
]

# One skill owns the durable writes, so this pass reaches the handoff and
# nothing else. A run that edited the wiki index to list its own page fails here
# rather than in a reading.
#
# The second entry is not a skill write. A `PreToolUse` hook drops a marker under
# the session's own project directory whenever a search reaches a folder carrying
# an `index.md`, and this skill's body sends every run to the standards folder to
# resolve a fallback path. Arms scoping `.claude/**` absorb it silently, and this
# is the first arm narrow enough to report it, so the entry is named here rather
# than exempted in the checker for every arm at once.
write_scope = [
  ".canon/tmp/teach-promotion/**",
  ".canon/tmp/index-reminder/**",
]

# The reply names the destination it proposed. The wiki prefix is the
# load-bearing token: a reply naming the page without a destination reads the
# same whether the routing test ran or not.
reply = [".claude/wiki/"]

manual = [
  "The destination sits in the wiki folder that matches who owns the subject, rather than in whichever one came first. Semantic: both folders exist and both are under the prefix the reply assertion checks, so the sub-folder choice is a judgment no pattern separates. The measured run landed on the concepts folder, which is correct for a subject no single vendor owns.",
  "The proposal names what the destination expects that the page does not carry, which is the sentence naming who owns the subject. Semantic: the page body in the handoff is prose either way, and a pattern over it cannot tell a supplied source line from a copied paragraph. The measured run supplied one.",
  "The page body arrives inside a fence, so a heading in the page is not read as a second destination. Semantic: a pattern over the fence line passes on a body that carries no heading to protect, which is the case it exists for. The measured run fenced it.",
  "A run against a project with no wiki folder refuses and names the command that creates one. Unwired: this arm seeds a wiki, because the refusal path writes nothing and would assert none of the routing. Splitting it into a second arm is the way to cover it.",
  "The lesson was neither proposed nor carried into the handoff. Semantic: a promoted lesson lands as a second block inside the same file, and no path assertion separates one block from two.",
  "The glossary was considered alongside the reference page rather than passed over. Semantic: a run that proposes one page and a run that proposes both satisfy every assertion above, and nothing here decides which is correct.",
  "Promotion was proposed rather than assumed. Unwired: the invocation confirms in advance, so a run that skipped the proposal and wrote the handoff directly passes every assertion above. The waiting half is what a headless arm cannot reach.",
]

# One heading per destination, naming the path. The wiki prefix is what says the
# routing test ran rather than that a file appeared.
[[content]]
path = ".canon/tmp/teach-promotion/promote-regex.md"
pattern = '^## \.claude/wiki/'

# The source line under the heading. Without it the fold lands a page with no
# record of which workspace produced it, and the workspace holds the only copy
# of the reasoning behind it.
[[content]]
path = ".canon/tmp/teach-promotion/promote-regex.md"
pattern = '^Source: \.canon/teach/01-regex/reference/reading-patterns\.md$'

# The page body travels with the block rather than being fetched at fold time.
# The heading below is the one the reference page carries, so a block holding
# only a pointer fails here.
[[content]]
path = ".canon/tmp/teach-promotion/promote-regex.md"
pattern = '^## Anchors$'
