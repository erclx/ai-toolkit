# What a correct `/canon:migration-standards-drop` run leaves behind on a target
# holding an installed `.claude/standards/` tree. Read by `canon sandbox check`.
# Patterns use TOML literal strings so a regex needs no backslash escaping.
#
# The skill proposes and writes nothing, so the tree assertions carry the whole
# no-write claim and the reply pins carry whether the proposal was sourced. A
# proposal-only arm cannot be covered by tree assertions alone, since a session
# that read nothing and answered nothing passes every one of them.

# The default cap rather than an observation. Three passes on 2026-08-28 cost
# 15, 11, and 10 turns for 0.34, 0.24, and 0.23 dollars, and a ceiling at the cap
# still catches a truncated run, which reports one turn past it.
#
# The spread is what keeps the cap where it is. All three scored 14 asserted and
# 0 failed, so a 50 percent range in turns bought no difference in what was
# checked, which is a proposal-only arm ordering its reads differently rather
# than a cost drifting. A ceiling near 15 would fire on the correct run that
# happens to take the long route.
max_turns = 30

# The four pins separate a run that read the tree from one that recited the
# skill body. `canon gov sync` and `git rm -r` are the first two commands of the
# ordered block and the ordering between them stays in `manual`, since a
# substring proves each appears and carries nothing about which came first.
#
# `standards-audit.sh` is the reader, reachable only by searching the non-markdown
# files, and `billing` is the one staged standard whose verdict turns on reading
# the catalog rather than on the filename. A run that skipped either read still
# produces a plausible drop proposal and fails here.
reply = [
  "canon gov sync",
  "git rm -r",
  "standards-audit.sh",
  "billing",
]

# Every staged file is still where provisioning put it. A run that produced a
# correct proposal and then applied it fails here and nowhere else.
paths = [
  ".claude/standards/slug.md",
  ".claude/standards/branch.md",
  ".claude/standards/prose.md",
  ".claude/standards/billing.md",
  ".claude/hooks/standards-audit.sh",
]

# The destination the `Keep` block names for the project's own standard. The
# skill proposes the move and does not make it, so a root `standards/` folder
# here means the run applied its own proposal, which no path assertion above
# would see.
absent = ["standards"]

# Prose the checker cannot assert, each with the reason it stays here.
manual = [
  "The sync is named ahead of the drop and the sweep after it. Semantic: three substrings prove the commands appear and carry no ordering, and the reverse order is the whole defect the block exists to prevent",
  "The project-local skill's citation repoints to `canon standards slug` rather than to the plugin-root form. Semantic: both spellings contain the word slug and the failing one is a path the run would present as correct, so no substring separates them",
  "`prose.md` was reported as a name the user places rather than repointed to a single standard. Semantic: a decline and a wrong one-to-one repoint both name prose, so the tokens do not separate them",
  "`slug.md` was called unchanged and `branch.md` drifted. Semantic: both filenames appear in a correct proposal whichever bucket each landed in",
  "The behind-version refusal was never exercised. Unwired: provisioning refuses on a stale binary, so the branch needs an arm that stages one",
  "The untracked drop command was never exercised. Unwired: the staged tree is committed, so `rm -rf` needs an arm that leaves it out of the index",
]

# The citing surfaces are byte-unchanged. A run that swept the citations after
# proposing them leaves every path assertion above passing and fails here, and
# the three are pinned separately because a run reaching only the first passes
# one and fails the other two.
[[content]]
path = "CLAUDE.md"
pattern = '^- Follow `\.claude/standards/slug\.md` when naming a file after a branch$'

[[content]]
path = ".claude/rules/project/900-house.md"
pattern = '^- Read `\.claude/standards/branch\.md` before renaming a branch$'

[[content]]
path = ".claude/skills/house-review/SKILL.md"
pattern = '^Read `\.claude/standards/slug\.md` from the project root for the slug transform\.$'

# The reader still parses the standard. The skill names its replacement and
# leaves the file, since routing the hook through the verb is the user's edit
# and doing it here would be the apply this skill refuses.
[[content]]
path = ".claude/hooks/standards-audit.sh"
pattern = '\.claude/standards/prose\.md'
