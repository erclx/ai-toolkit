# What a correct `/aitk:migration-standards` run leaves behind on a project whose
# standards and snippets never moved under `.claude/`. Read by
# `aitk sandbox check`. Patterns use TOML literal strings so a regex needs no
# backslash escaping.
#
# The skill had no scenario at all before this one, so nothing could fail it. It
# is the proposal half of the route `claude:toolkit-operator/unmigrated` scores,
# and the two arms assert different things: that one scores the decision to come
# here, and this one scores what the skill produces once it arrives.

# A clean run cost 6 turns on 2026-08-04. The skill proposes and stops, so the
# cost is one report read plus two greps, and it does not move with the size of
# the tree the way an arm that writes does.
max_turns = 12

# The proposal, pinned on the two commands rather than on the prose around them.
# A run reaching only the first domain in `unmigrated` passes the standards pin
# and fails the snippets one, which is the failure a single pin would miss.
#
# `(3 files)` is what separates the report from the folder listing it replaced.
# Root `standards/` holds five markdown files and the toolkit ships three of
# them, so a run that counted the folder reports five and a run that read
# `unmigrated` reports three. The count is the only place in the output where the
# two detection paths disagree, since the proposed command moves the whole folder
# either way.
reply = [
  "git mv standards .claude/standards",
  "git mv snippets .claude/snippets",
  "(3 files)",
]

# Nothing moved. The skill proposes and the user runs, so every staged file is
# still where the fixture put it. These fail the run that produced a correct
# proposal and then executed it, which is the outcome the reply pins cannot see.
paths = [
  "standards/architecture.md",
  "standards/api-conventions.md",
  "snippets/align.md",
]

absent = [".claude/standards", ".claude/snippets"]

# Prose the checker cannot assert, each with the reason it stays here.
manual = [
  "The two project-authored files are named as riding along with the move. Semantic: `git mv standards .claude/standards` relocates the whole folder whichever count is reported, so the filter changes what the user is told rather than what the command does",
  "Both author-owned references are reported as TODO lines. Semantic: a reply carrying the two paths cannot be distinguished from one that listed them for another reason, and the content pin below only proves neither was rewritten",
  "No reference inside a toolkit-owned rule or skill was surfaced. Semantic: this fixture stages none, so the claim needs an arm that installs governance first",
  "The counts were not described as unfiltered. Unwired: the fallback branch fires when `aitk` is off `PATH`, which needs an arm that provisions without it",
]

# The reference is reported and left alone. The skill states outright that it
# does not edit `CLAUDE.md`, a rule file, or a doc, and a run that helpfully
# rewrote the path would leave the user a proposal already half applied against a
# move nobody has run yet.
[[content]]
path = "CLAUDE.md"
pattern = 'Follow `standards/context\.md` when writing one\.'

[[content]]
path = "docs/contributing.md"
pattern = 'snippets/align\.md'
