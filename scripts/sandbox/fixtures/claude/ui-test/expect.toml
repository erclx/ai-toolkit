# What a correct `/aitk:claude-ui-test` run leaves behind on the default arm.
# Read by `aitk sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.
#
# This arm keeps real coverage where `claude/review` and `claude/memory-review`
# lose theirs. The e2e file is an ordinary project file and lands inside
# `.sandbox/`, so the assertions over it run. The checklist is shared session
# scratch and escapes, so its assertions are demoted. See the `manual` entries
# and the fourth standing limit in `.claude/context/sandbox.md`.

# The precondition, asserted rather than described. `claude/ui-test.sh` declares
# no `SANDBOX_INJECT_STANDARDS`, so the project copy is absent and the plugin
# fallback is the only route to the slug transform. Injecting standards later
# would resolve the project path and void the premise of this arm, so the absence
# is asserted where that edit lands.
#
# The checklist filenames a wrong run would choose are deliberately not listed
# here. No checklist reaches `.sandbox/` under any name, so each entry would pass
# because the file is elsewhere rather than because the run was correct.
absent = [".claude/standards/skill.md"]

paths = ["e2e/ui.test.ts"]

# The skill appends to the existing e2e file, writes the checklist under
# `.claude/`, and installs Playwright to run what it wrote. Nothing else on the
# branch is its to touch, and a run that edited `src/components/TaskList.tsx` has
# fixed the implementation rather than tested it.
#
# `node_modules/**` is here because the skill's body tells it to run the tests,
# which needs the install. A run on 2026-08-02 wrote 184 files under it and the
# scope reported every one as a violation, which was the declaration being wrong
# rather than the run.
write_scope = [".claude/**", "e2e/**", "node_modules/**"]

# The seeded test survives. The skill adds to the existing file rather than
# replacing it, and a run that overwrote the file has deleted coverage while
# reporting that it added some.
[[content]]
path = "e2e/ui.test.ts"
pattern = 'task list renders the seeded tasks'

# A test for the empty state, which is the one automatable change with a single
# correct reading. The filter input and the count-after-filtering cases are
# describable in wording no pattern anticipates.
[[content]]
path = "e2e/ui.test.ts"
pattern = 'No tasks match that filter'

# A clean run cost 21 turns on 2026-08-02, against 29 for the run before the
# fixture was corrected, where the skill spent its budget reporting the unmounted
# input. Set equal to the default cap rather than under it: a truncated run
# reports one turn past its cap, so an equal ceiling still catches truncation
# while a lower one fails legitimate runs landing in the gap.
max_turns = 30

manual = [
  "The checklist lands at `.claude/review/ui-checklist-feat-task-filter.md`, which is the slug transform in `standards/skill.md` applied to branch `feat/task-filter`. The transform appears in no skill body, so the filename is the evidence that the plugin fallback resolved. Unwired: nothing determines which root the file lands under, since the sandbox's seeded `CLAUDE.md` and the toolkit's ancestor copy both send shared scratch to the main worktree root. This arm's run on 2026-08-02 put it in the right place and the `claude/review` run put its own output in the toolkit, so declaring the path would go red on the runs that get it wrong for a reason the arm is not about",
  "The checklist carries the `- [ ]` checkbox syntax the skill's format fixes. Unwired: same escape, and no assertion can read a file the snapshot never sees",
  "The spacing, padding, and color changes land on the checklist and the filter input does not. Semantic: the split between automatable and visual is the skill's judgment, and a pattern matching one item cannot tell a correct classification from a lucky one",
  "The chat output names the checklist path alone and does not repeat the checklist body. Unwired: the claim is about what the reply omits, and a negative substring passes on every reply that phrases it differently",
  "The failed Playwright run is reported rather than passed over. Unwired: no browser is installed in the sandbox, so the honest-degradation path is the only one reachable here and the working one stays untested",
]
