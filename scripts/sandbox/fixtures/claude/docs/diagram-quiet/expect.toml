# What a correct `/claude-docs` run leaves behind on the diagram-quiet arm.
# Read by `aitk sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# The arm asserts a negative, which is the case prose expectations hold worst.
# Every Step 5 trigger is present and none may fire: `.claude/REQUIREMENTS.md` is
# committed before the branch with no entry covering it, and `components.md`
# cites `src/gov/sync.ts`, which the branch edits without removing.

# No stub. A sweep keying on the signal existing rather than on it entering the
# tree writes this file, and that is the over-firing the warning this step
# replaced died of.
absent = [".claude/diagrams/system-context.md"]

write_scope = [".claude/**"]

# `components.md` frontmatter, pinned whole. `content` matches positively, so
# asserting the block from its opening fence to its closing one is what proves a
# key is absent: a run that appended `stale` pushes the closing `---` down a line
# and the match fails. Asserting `verified` alone would pass on that run.
[[content]]
path = ".claude/diagrams/components.md"
pattern = '^---\ntitle: Components\ndescription: [^\n]+\ncategory: Components\nverified: a1b2c3d4 2026-07-20\n---$'

# No max_turns. The other arms carry a measured figure and this one has no clean
# run to quote yet, so a guessed ceiling would fail honest runs or assert
# nothing. Add it once a run has been observed.

# Prose the checker cannot assert, each with the reason it stays here. Both are
# negatives about emitted text, which is the shape the reply kind refuses.
manual = [
  "Step 5 emits no line at all, neither a stub nor a drift warning. Semantic: a negative over emitted text, and a substring passes on every run that words the line differently",
  "The run closes on one line, not on both Step 2's report and the After completion fallback. Semantic: the claim counts lines rather than naming a token, and no kind counts",
]
